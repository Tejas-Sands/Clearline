<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#153c33" />
    <meta name="description" content="Fund, convert, pay, and reconcile stablecoin invoices with Clearline. Try the step-by-step example, explore the simulation, or use free testnet tokens." />
    <script>
      (() => {
        let saved;
        try { saved = localStorage.getItem('clearline.theme.v1'); } catch {}
        const theme = saved === 'dark' || saved === 'light' ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#0d1713' : '#f8f9f5';
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Clearline · Settlement operations</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
